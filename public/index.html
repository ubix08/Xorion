<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orion AI</title>
    
    <!-- Markdown & Code Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #212121;
            --bg-secondary: #2f2f2f;
            --bg-tertiary: #3d3d3d;
            --bg-hover: #424242;
            --bg-input: #40414f;
            --text-primary: #ececec;
            --text-secondary: #c5c5d2;
            --text-muted: #8e8ea0;
            --border: #565869;
            --accent: #19c37d;
            --accent-hover: #1a9f6f;
            --user-msg: #343541;
            --assistant-msg: transparent;
            --shadow: rgba(0, 0, 0, 0.3);
            --sidebar-width: 260px;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f7f8;
            --bg-tertiary: #ececf1;
            --bg-hover: #e5e5e5;
            --bg-input: #ffffff;
            --text-primary: #0d0d0d;
            --text-secondary: #2d2d2d;
            --text-muted: #6e6e80;
            --border: #d9d9e3;
            --accent: #10a37f;
            --accent-hover: #0d8566;
            --user-msg: #f7f7f8;
            --assistant-msg: transparent;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .btn-new-chat {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-new-chat:hover {
            background: var(--bg-hover);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-item:hover {
            background: var(--bg-hover);
        }

        .session-item.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-profile:hover {
            background: var(--bg-hover);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg-primary);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-toggle-sidebar {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: background 0.2s;
        }

        .btn-toggle-sidebar:hover {
            background: var(--bg-hover);
        }

        .model-selector {
            padding: 6px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: background 0.2s;
            font-size: 18px;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .messages-wrapper {
            max-width: 48rem;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .message.user .message-avatar {
            background: var(--accent);
            color: white;
        }

        .message.assistant .message-avatar {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-text {
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message-text p {
            margin-bottom: 16px;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text pre {
            margin: 16px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .message-text code {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .message-text :not(pre) > code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .code-block {
            position: relative;
            margin: 16px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #2d2d2d;
            border-bottom: 1px solid #3d3d3d;
        }

        .code-language {
            font-size: 12px;
            color: #8e8ea0;
            text-transform: uppercase;
        }

        .btn-copy-code {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #565869;
            border-radius: 4px;
            color: #ececec;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-code:hover {
            background: #3d3d3d;
        }

        .btn-copy-code.copied {
            background: var(--accent);
            border-color: var(--accent);
        }

        .code-content {
            overflow-x: auto;
        }

        .code-content pre {
            margin: 0;
            padding: 16px;
        }

        /* Thinking Indicator */
        .thinking-container {
            margin-bottom: 24px;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .thinking-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            max-width: 48rem;
            margin: 0 auto;
        }

        .thinking-icon {
            animation: thinkingPulse 1.5s ease-in-out infinite;
        }

        @keyframes thinkingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        .thinking-text {
            flex: 1;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Streaming Cursor */
        .streaming-cursor {
            display: inline-block;
            width: 8px;
            height: 20px;
            background: var(--accent);
            margin-left: 2px;
            animation: cursorBlink 1s infinite;
            vertical-align: text-bottom;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Tool Usage Badge */
        .tool-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin: 4px 4px 4px 0;
        }

        .tool-icon {
            font-size: 14px;
        }

        /* Input Area */
        .input-area {
            border-top: 1px solid var(--border);
            padding: 16px;
            background: var(--bg-primary);
        }

        .input-wrapper {
            max-width: 48rem;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(25, 195, 125, 0.1);
        }

        .input-top {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .uploaded-file {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-remove-file {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-main {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 200px;
            min-height: 24px;
            line-height: 1.5;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .btn-attach {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .btn-attach:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-send {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.2s;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent) 0%, #1a9f6f 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 24px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 600px;
            width: 100%;
        }

        .suggestion-card {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-card:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .suggestion-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .suggestion-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            animation: modalSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(80vh - 140px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-width: 300px;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            gap: 12px;
            align-items: start;
            pointer-events: all;
            animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast.success { border-left: 3px solid var(--accent); }
        .toast.error { border-left: 3px solid #ef4444; }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-hover);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 200;
            }

            .messages-wrapper {
                padding: 16px 12px;
            }

            .message {
                gap: 12px;
            }

            .message-avatar {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            .suggestions-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                width: 95%;
            }

            .header-left span {
                display: none;
            }
        }

        /* File input hidden */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" id="newChatBtn">
                    <span>✨</span>
                    <span>New chat</span>
                </button>
            </div>
            
            <div class="sessions-list" id="sessionsList">
                <!-- Sessions will be populated here -->
            </div>
            
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfile">
                    <div class="user-avatar">R</div>
                    <div class="user-info">
                        <div class="user-name">Rachid</div>
                        <div class="user-status">● Online</div>
                    </div>
                    <span>⚙️</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="btn-toggle-sidebar" id="toggleSidebar">
                        <span>☰</span>
                    </button>
                    <span style="font-weight: 600; font-size: 16px;">Orion AI</span>
                </div>
                
                <div class="header-right">
                    <button class="btn-icon" id="themeToggle" title="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <button class="btn-icon" id="settingsBtn" title="Settings">
                        <span>⚙️</span>
                    </button>
                </div>
            </header>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">
                <div class="messages-wrapper" id="messagesWrapper">
                    <!-- Empty State -->
                    <div class="empty-state" id="emptyState">
                        <div class="empty-logo">🚀</div>
                        <h1 class="empty-title">Welcome to Orion AI</h1>
                        <p class="empty-subtitle">Your intelligent multi-agent assistant with real-time streaming</p>
                        
                        <div class="suggestions-grid">
                            <div class="suggestion-card" data-prompt="Tell me about yourself and your capabilities">
                                <div class="suggestion-icon">👋</div>
                                <div class="suggestion-text">Introduce yourself</div>
                            </div>
                            <div class="suggestion-card" data-prompt="Search for the latest AI developments">
                                <div class="suggestion-icon">🔍</div>
                                <div class="suggestion-text">Search the web</div>
                            </div>
                            <div class="suggestion-card" data-prompt="Analyze this data and create visualizations">
                                <div class="suggestion-icon">📊</div>
                                <div class="suggestion-text">Analyze data</div>
                            </div>
                            <div class="suggestion-card" data-prompt="Write a Python function to calculate fibonacci">
                                <div class="suggestion-icon">💻</div>
                                <div class="suggestion-text">Write code</div>
                            </div>
                        </div>
                    </div>
                    <!-- Messages will be inserted here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-top" id="uploadedFiles" style="display: none;">
                        <!-- Uploaded files will appear here -->
                    </div>
                    
                    <div class="input-main">
                        <textarea 
                            id="messageInput" 
                            placeholder="Message Orion AI..." 
                            rows="1"
                            autocomplete="off"
                        ></textarea>
                        
                        <div class="input-actions">
                            <button class="btn-attach" id="attachBtn" title="Attach file">
                                <span>📎</span>
                            </button>
                            <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.doc,.docx" multiple>
                            <button class="btn-send" id="sendBtn" title="Send message">
                                <span>↑</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="input-hint">
                        Press Enter to send, Shift + Enter for new line
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="btn-icon" id="closeSettings">
                    <span>✕</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Worker URL</label>
                    <input type="text" class="form-input" id="workerUrl" value="https://xorion.ubixsnow08.workers.dev">
                </div>
                <div class="form-group">
                    <label class="form-label">Session ID</label>
                    <input type="text" class="form-input" id="sessionId" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Theme</label>
                    <select class="form-input" id="themeSelect">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="clearSession">Clear session</button>
                <button class="btn btn-primary" id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // =====================================================
        // Configuration & State
        // =====================================================
        const state = {
            ws: null,
            sessionId: null,
            workerUrl: 'https://xorion.ubixsnow08.workers.dev',
            theme: 'dark',
            isProcessing: false,
            reconnectAttempts: 0,
            maxReconnectAttempts: 5,
            currentStreamingMessage: null,
            uploadedFiles: [],
            sessions: []
        };

        const elements = {
            sidebar: document.getElementById('sidebar'),
            toggleSidebar: document.getElementById('toggleSidebar'),
            newChatBtn: document.getElementById('newChatBtn'),
            sessionsList: document.getElementById('sessionsList'),
            messagesContainer: document.getElementById('messagesContainer'),
            messagesWrapper: document.getElementById('messagesWrapper'),
            emptyState: document.getElementById('emptyState'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            attachBtn: document.getElementById('attachBtn'),
            fileInput: document.getElementById('fileInput'),
            uploadedFiles: document.getElementById('uploadedFiles'),
            settingsModal: document.getElementById('settingsModal'),
            settingsBtn: document.getElementById('settingsBtn'),
            closeSettings: document.getElementById('closeSettings'),
            saveSettings: document.getElementById('saveSettings'),
            clearSession: document.getElementById('clearSession'),
            workerUrl: document.getElementById('workerUrl'),
            sessionId: document.getElementById('sessionId'),
            themeToggle: document.getElementById('themeToggle'),
            themeSelect: document.getElementById('themeSelect'),
            userProfile: document.getElementById('userProfile'),
            toastContainer: document.getElementById('toastContainer')
        };

        // =====================================================
        // Markdown Configuration
        // =====================================================
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        // =====================================================
        // Utility Functions
        // =====================================================
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMarkdown(text) {
            // Pre-process code blocks to add language detection
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang || 'plaintext';
                return `<div class="code-block">
                    <div class="code-header">
                        <span class="code-language">${language}</span>
                        <button class="btn-copy-code" onclick="copyCode(this)">Copy</button>
                    </div>
                    <div class="code-content">
                        <pre><code class="language-${language}">${escapeHtml(code.trim())}</code></pre>
                    </div>
                </div>`;
            });

            return marked.parse(text);
        }

        function copyCode(button) {
            const codeBlock = button.closest('.code-block');
            const code = codeBlock.querySelector('code').textContent;
            
            navigator.clipboard.writeText(code).then(() => {
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        function showToast(title, message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${type === 'success' ? '✓' : '✕'}</div>
                <div class="toast-content">
                    <div class="toast-title">${escapeHtml(title)}</div>
                    <div class="toast-message">${escapeHtml(message)}</div>
                </div>
            `;
            elements.toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function scrollToBottom() {
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
        }

        // =====================================================
        // Theme Management
        // =====================================================
        function setTheme(theme) {
            state.theme = theme;
            document.body.setAttribute('data-theme', theme);
            elements.themeSelect.value = theme;
            
            const icon = elements.themeToggle.querySelector('.theme-icon');
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            
            localStorage.setItem('orion_theme', theme);
        }

        elements.themeToggle.addEventListener('click', () => {
            setTheme(state.theme === 'dark' ? 'light' : 'dark');
        });

        elements.themeSelect.addEventListener('change', (e) => {
            setTheme(e.target.value);
        });

        // =====================================================
        // Session Management
        // =====================================================
        function loadSessions() {
            const sessions = JSON.parse(localStorage.getItem('orion_sessions') || '[]');
            state.sessions = sessions;
            renderSessions();
        }

        function renderSessions() {
            elements.sessionsList.innerHTML = state.sessions.map(session => `
                <div class="session-item ${session.id === state.sessionId ? 'active' : ''}" 
                     data-session-id="${session.id}">
                    <span>💬</span>
                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        ${escapeHtml(session.title || 'New conversation')}
                    </span>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.dataset.sessionId;
                    if (sessionId !== state.sessionId) {
                        switchSession(sessionId);
                    }
                });
            });
        }

        function saveSession() {
            const existingIndex = state.sessions.findIndex(s => s.id === state.sessionId);
            const session = {
                id: state.sessionId,
                title: getSessionTitle(),
                timestamp: Date.now()
            };

            if (existingIndex >= 0) {
                state.sessions[existingIndex] = session;
            } else {
                state.sessions.unshift(session);
            }

            // Keep only last 20 sessions
            state.sessions = state.sessions.slice(0, 20);
            localStorage.setItem('orion_sessions', JSON.stringify(state.sessions));
            renderSessions();
        }

        function getSessionTitle() {
            const messages = elements.messagesWrapper.querySelectorAll('.message.user');
            if (messages.length > 0) {
                const firstMsg = messages[0].querySelector('.message-text').textContent;
                return firstMsg.substring(0, 50) + (firstMsg.length > 50 ? '...' : '');
            }
            return 'New conversation';
        }

        function switchSession(sessionId) {
            if (state.ws) {
                state.ws.close();
            }
            
            state.sessionId = sessionId;
            localStorage.setItem('orion_session_id', sessionId);
            elements.sessionId.value = sessionId;
            
            // Clear current messages
            const messages = elements.messagesWrapper.querySelectorAll('.message, .thinking-container');
            messages.forEach(msg => msg.remove());
            elements.emptyState.style.display = 'flex';
            
            connectWebSocket();
            renderSessions();
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                elements.sidebar.classList.add('collapsed');
            }
        }

        // =====================================================
        // Message UI Functions
        // =====================================================
        function hideEmptyState() {
            if (elements.emptyState) {
                elements.emptyState.style.display = 'none';
            }
        }

        function addMessage(role, content, isStreaming = false) {
            hideEmptyState();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'R' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            
            if (role === 'assistant' && !isStreaming) {
                textDiv.innerHTML = formatMarkdown(content);
                // Re-highlight code blocks
                textDiv.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            } else {
                textDiv.textContent = content;
                if (isStreaming) {
                    const cursor = document.createElement('span');
                    cursor.className = 'streaming-cursor';
                    textDiv.appendChild(cursor);
                }
            }
            
            contentDiv.appendChild(textDiv);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            
            elements.messagesWrapper.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }

        function updateStreamingMessage(messageElement, additionalContent) {
            const textDiv = messageElement.querySelector('.message-text');
            const cursor = textDiv.querySelector('.streaming-cursor');
            
            // Update text content
            const currentText = textDiv.textContent.replace('|', '');
            textDiv.textContent = currentText + additionalContent;
            
            // Re-add cursor
            if (cursor) {
                textDiv.appendChild(cursor);
            }
            
            scrollToBottom();
        }

        function finalizeStreamingMessage(messageElement) {
            const textDiv = messageElement.querySelector('.message-text');
            const cursor = textDiv.querySelector('.streaming-cursor');
            if (cursor) cursor.remove();
            
            // Format as markdown
            const content = textDiv.textContent;
            textDiv.innerHTML = formatMarkdown(content);
            
            // Re-highlight code blocks
            textDiv.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });
            
            scrollToBottom();
        }

        function showThinking(text, icon = '🧠') {
            removeThinking();
            
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-container';
            thinkingDiv.id = 'thinkingIndicator';
            thinkingDiv.innerHTML = `
                <div class="thinking-card">
                    <div class="thinking-icon">${icon}</div>
                    <div class="thinking-text">${escapeHtml(text)}</div>
                    <div class="thinking-dots">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>
            `;
            
            elements.messagesWrapper.appendChild(thinkingDiv);
            scrollToBottom();
        }

        function removeThinking() {
            const thinking = document.getElementById('thinkingIndicator');
            if (thinking) thinking.remove();
        }

        function showToolBadge(tool, params) {
            const badges = {
                google_search: { icon: '🔍', label: 'Searching web' },
                code_execution: { icon: '⚡', label: 'Running code' },
                web_fetch: { icon: '🌐', label: 'Fetching page' },
                worker_deep_search: { icon: '🔬', label: 'Deep research' },
                worker_data_analyst: { icon: '📊', label: 'Analyzing data' },
                worker_code_developer: { icon: '💻', label: 'Writing code' }
            };

            const badge = badges[tool] || { icon: '🔧', label: tool };
            showThinking(badge.label, badge.icon);
        }

        // =====================================================
        // WebSocket Connection
        // =====================================================
        function connectWebSocket() {
            if (state.ws && (state.ws.readyState === WebSocket.CONNECTING || state.ws.readyState === WebSocket.OPEN)) {
                console.log('WebSocket already connected');
                return;
            }

            const wsUrl = state.workerUrl.replace('https://', 'wss://').replace('http://', 'ws://');
            const fullUrl = `${wsUrl}/api/ws?session_id=${state.sessionId}`;
            
            console.log('🔌 Connecting WebSocket:', fullUrl);
            
            try {
                state.ws = new WebSocket(fullUrl);
                
                state.ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    state.reconnectAttempts = 0;
                    
                    // Heartbeat
                    setInterval(() => {
                        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                            state.ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 30000);
                };
                
                state.ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        handleWebSocketMessage(message);
                    } catch (e) {
                        console.error('Failed to parse message:', e);
                    }
                };
                
                state.ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                };
                
                state.ws.onclose = (event) => {
                    console.log('🔌 WebSocket closed:', event.code);
                    state.ws = null;
                    
                    // Reconnect
                    if (state.reconnectAttempts < state.maxReconnectAttempts) {
                        state.reconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, state.reconnectAttempts), 30000);
                        console.log(`Reconnecting in ${delay}ms...`);
                        setTimeout(connectWebSocket, delay);
                    } else {
                        showToast('Connection Lost', 'Please refresh the page', 'error');
                    }
                };
                
            } catch (e) {
                console.error('Failed to create WebSocket:', e);
            }
        }

        // =====================================================
        // WebSocket Message Handler
        // =====================================================
        function handleWebSocketMessage(message) {
            console.log('📨 Message:', message.type);
            
            switch (message.type) {
                case 'status':
                    showThinking(message.message);
                    break;
                    
                case 'thought':
                    console.log('💭 Thinking:', message.content);
                    break;
                    
                case 'chunk':
                    removeThinking();
                    if (!state.currentStreamingMessage) {
                        state.currentStreamingMessage = addMessage('assistant', '', true);
                    }
                    updateStreamingMessage(state.currentStreamingMessage, message.content);
                    break;
                    
                case 'tool_use':
                    showToolBadge(message.tool, message.params);
                    break;
                    
                case 'artifact':
                    showToast('Artifact Created', message.artifact.title, 'success');
                    break;
                    
                case 'worker_started':
                case 'worker_progress':
                    showThinking(message.message, '⚙️');
                    break;
                    
                case 'worker_completed':
                    removeThinking();
                    break;
                    
                case 'complete':
                    removeThinking();
                    
                    if (state.currentStreamingMessage) {
                        finalizeStreamingMessage(state.currentStreamingMessage);
                        state.currentStreamingMessage = null;
                    } else if (message.response) {
                        addMessage('assistant', message.response);
                    }
                    
                    state.isProcessing = false;
                    elements.sendBtn.disabled = false;
                    elements.messageInput.disabled = false;
                    
                    // Save session
                    saveSession();
                    
                    console.log('✅ Complete');
                    break;
                    
                case 'error':
                    removeThinking();
                    
                    if (state.currentStreamingMessage) {
                        state.currentStreamingMessage.remove();
                        state.currentStreamingMessage = null;
                    }
                    
                    addMessage('assistant', `❌ Error: ${message.error}`);
                    showToast('Error', message.error, 'error');
                    
                    state.isProcessing = false;
                    elements.sendBtn.disabled = false;
                    elements.messageInput.disabled = false;
                    break;
                    
                case 'pong':
                    break;
                    
                default:
                    console.warn('Unknown message type:', message.type);
            }
        }

        // =====================================================
        // Send Message
        // =====================================================
        function sendMessage(content) {
            if (!content.trim() || state.isProcessing) return;
            
            if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
                showToast('Connection Error', 'Reconnecting...', 'error');
                connectWebSocket();
                return;
            }
            
            console.log('📤 Sending:', content);
            
            state.isProcessing = true;
            elements.sendBtn.disabled = true;
            elements.messageInput.disabled = true;
            
            // Add user message
            addMessage('user', content);
            
            // Clear input
            elements.messageInput.value = '';
            elements.messageInput.style.height = 'auto';
            
            // Reset state
            state.currentStreamingMessage = null;
            
            // Send via WebSocket
            try {
                state.ws.send(JSON.stringify({
                    type: 'user_message',
                    content: content,
                    images: state.uploadedFiles.filter(f => f.type.startsWith('image/')).map(f => ({
                        data: f.data,
                        mimeType: f.type
                    }))
                }));
                
                // Clear uploaded files
                state.uploadedFiles = [];
                elements.uploadedFiles.style.display = 'none';
                elements.uploadedFiles.innerHTML = '';
            } catch (e) {
                console.error('Failed to send:', e);
                showToast('Error', 'Failed to send message', 'error');
                state.isProcessing = false;
                elements.sendBtn.disabled = false;
                elements.messageInput.disabled = false;
            }
        }

        // =====================================================
        // File Upload
        // =====================================================
        elements.attachBtn.addEventListener('click', () => {
            elements.fileInput.click();
        });

        elements.fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    showToast('File Too Large', `${file.name} exceeds 10MB`, 'error');
                    continue;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result.split(',')[1];
                    state.uploadedFiles.push({
                        name: file.name,
                        type: file.type,
                        data: base64
                    });
                    renderUploadedFiles();
                };
                reader.readAsDataURL(file);
            }
            
            e.target.value = '';
        });

        function renderUploadedFiles() {
            if (state.uploadedFiles.length === 0) {
                elements.uploadedFiles.style.display = 'none';
                return;
            }
            
            elements.uploadedFiles.style.display = 'flex';
            elements.uploadedFiles.innerHTML = state.uploadedFiles.map((file, index) => `
                <div class="uploaded-file">
                    <span>📎 ${escapeHtml(file.name)}</span>
                    <button class="btn-remove-file" onclick="removeFile(${index})">✕</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            state.uploadedFiles.splice(index, 1);
            renderUploadedFiles();
        }

        // =====================================================
        // Event Listeners
        // =====================================================
        elements.toggleSidebar.addEventListener('click', () => {
            elements.sidebar.classList.toggle('collapsed');
        });

        elements.newChatBtn.addEventListener('click', () => {
            const newSessionId = generateUUID();
            switchSession(newSessionId);
            showToast('New Chat', 'Started a new conversation', 'success');
        });

        elements.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        elements.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(elements.messageInput.value);
            }
        });

        elements.sendBtn.addEventListener('click', () => {
            sendMessage(elements.messageInput.value);
        });

        // Suggestion cards
        document.querySelectorAll('.suggestion-card').forEach(card => {
            card.addEventListener('click', () => {
                const prompt = card.dataset.prompt;
                elements.messageInput.value = prompt;
                sendMessage(prompt);
            });
        });

        // Settings
        elements.settingsBtn.addEventListener('click', () => {
            elements.settingsModal.classList.add('active');
        });

        elements.userProfile.addEventListener('click', () => {
            elements.settingsModal.classList.add('active');
        });

        elements.closeSettings.addEventListener('click', () => {
            elements.settingsModal.classList.remove('active');
        });

        elements.saveSettings.addEventListener('click', () => {
            const oldUrl = state.workerUrl;
            state.workerUrl = elements.workerUrl.value;
            localStorage.setItem('orion_worker_url', state.workerUrl);
            
            if (oldUrl !== state.workerUrl && state.ws) {
                state.ws.close();
                connectWebSocket();
            }
            
            elements.settingsModal.classList.remove('active');
            showToast('Settings Saved', 'Configuration updated', 'success');
        });

        elements.clearSession.addEventListener('click', async () => {
            if (!confirm('Clear all session data?')) return;
            
            try {
                await fetch(`${state.workerUrl}/api/clear?session_id=${state.sessionId}`, {
                    method: 'POST'
                });
                
                showToast('Session Cleared', 'All data has been cleared', 'success');
                setTimeout(() => location.reload(), 1000);
            } catch (e) {
                showToast('Error', 'Failed to clear session', 'error');
            }
        });

        elements.settingsModal.addEventListener('click', (e) => {
            if (e.target === elements.settingsModal) {
                elements.settingsModal.classList.remove('active');
            }
        });

        // Mobile: close sidebar when clicking outside
        elements.messagesContainer.addEventListener('click', () => {
            if (window.innerWidth <= 768 && !elements.sidebar.classList.contains('collapsed')) {
                elements.sidebar.classList.add('collapsed');
            }
        });

        // =====================================================
        // Initialization
        // =====================================================
        function init() {
            console.log('🚀 Initializing Orion AI Professional UI...');

            // Load settings
            const savedUrl = localStorage.getItem('orion_worker_url');
            if (savedUrl) {
                state.workerUrl = savedUrl;
                elements.workerUrl.value = savedUrl;
            }

            const savedTheme = localStorage.getItem('orion_theme') || 'dark';
            setTheme(savedTheme);

            // Session
            state.sessionId = localStorage.getItem('orion_session_id') || generateUUID();
            localStorage.setItem('orion_session_id', state.sessionId);
            elements.sessionId.value = state.sessionId;

            // Load sessions
            loadSessions();

            // Mobile: start with collapsed sidebar
            if (window.innerWidth <= 768) {
                elements.sidebar.classList.add('collapsed');
            }

            // Connect WebSocket
            connectWebSocket();

            console.log('✅ Initialized');
        }

        // Start
        init();

        // Make functions global for inline handlers
        window.copyCode = copyCode;
        window.removeFile = removeFile;
    </script>
</body>
</html>
